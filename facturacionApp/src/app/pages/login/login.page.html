<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="login()">
    <ion-item>
      <ion-label position="floating">Usuario</ion-label>
      <ion-input type="text" [(ngModel)]="credentials.username" name="username" required></ion-input>
    </ion-item>
    
    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="credentials.password" name="password" required></ion-input>
    </ion-item>
    
    <div class="ion-padding-top">
      <ion-button expand="block" type="submit">Iniciar Sesión</ion-button>
    </div>
    
    <div *ngIf="errorMessage" class="error-message ion-text-center ion-padding-top">
      {{errorMessage}}
    </div>
  </form>
</ion-content>
